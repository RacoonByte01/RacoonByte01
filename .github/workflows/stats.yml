name: Update profile stats

# Renders cards/activity.svg and cards/languages.svg from the GitHub API and commits
# them to main, which the README reads from raw.githubusercontent.com.
# No third-party card service involved, so nothing here can break on someone else's outage.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Generate cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATS_USERNAME: RacoonByte01
          OUT_DIR: cards
        run: node .github/scripts/generate-stats.mjs

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cards
          if git diff --cached --quiet; then
            echo 'cards are already up to date'
          else
            git commit -m 'chore: update profile cards'
            git push origin HEAD:main
          fi
